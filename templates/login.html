{% extends "base.html" %}
{% block titulo %}Iniciar sesión - Devolt Inventory{% endblock %}

{% block contenido %}
<section class="tarjeta login">
  <!--<span class="franja" aria-hidden="true"><i class="deimos"></i><i class="phobos"></i><i class="kova"></i></span>-->
  <span><img class="logo" src="{{ url_for('static', filename='images/piezas/logo devolt.jpg') }}" alt="Devolt Inventory"></span>
  <h1>Devolt Inventory</h1>
  <p class="suave">Inicia sesión para consultar y pedir piezas del taller.</p>

  <form method="post">
    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button class="boton" type="submit">Iniciar sesión</button>
  </form>
</section>
{% endblock %}
